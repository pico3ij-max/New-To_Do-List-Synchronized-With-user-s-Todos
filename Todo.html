<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Todo 🙂</title>
    <link rel="stylesheet" href="./Todo.css/Todo.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body onload="Gettodosfromlocalstorage(); getDataColors()">
    <h1>TDoList</h1>

    <section class="container">
        <div>
            <button type="button" class="AddTodo">+Add Todo</button>
            <button type="button" class="sort"> sort-By <span class="bi bi-chevron-right rotate"></span>

                <ul class="sort1">
                    <li class="bysort"><a href="#" data-value="Complete">Complete</a></li>
                    <li class="bysort"><a href="#" data-value="Incomplete">Incomplete</a></li>
                    <li class="bysort"><a href="#" data-value="All">All</a></li>
                </ul>

            </button>
        </div>

        <div class="todolist-container">
            <!-- ! User Todos Write With JS -->
        </div>

    </section>


    <div class="overlay hide">
        <section class="New-todo">
            <header>
                <button type="button" class="for-close"></button>
                <h3>Wellcome</h3>
            </header>

            <main>
                <input type="text" id="write-Todo" name="Write-Todo" placeholder="Enter Your To Do">
                <section>
                    <div class="colors">
                        <h4>Pick Your ToDo Color :</h4>

                        <span data-color="0,0,0"></span>
                        <span data-color="250,250,250"></span>
                        <span data-color="100,100,100"></span>
                        <span data-color="80,100,250"></span>
                        <span data-color="37,222,4"></span>
                    </div>
                    <div class="bgcolors">
                        <h4>Pick Your ToDo Bgcolor :</h4>

                        <span data-bgcolor="212, 240, 5"></span>
                        <span data-bgcolor="250,250,250"></span>
                        <span data-bgcolor="194,34,2"></span>
                        <span data-bgcolor="0,0,139"></span>
                        <span data-bgcolor="0,0,0"></span>
                    </div>
                </section>
                
                <section>
                    <button type="button" class="btns addtodo">Add</button>
                    <button type="button" class="btns cancel">Back</button>
                </section>
            </main>
            
        </section>
    </div>


    <script src="./app.js/Todo.js"></script>
</body>
</html>
